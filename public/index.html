<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>とわのメモ帳</title>
<style>
  :root { --bg:#f6f1ea; --card:#fffdf9; --ink:#3b2f2a; --sub:#7a6a60; --accent:#6b4a3a; --line:#e3d8cc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p.lead { color: var(--sub); margin: 0 0 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; width: 100%; font-weight: 600; }
  .ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  .who { display:flex; align-items:center; gap:12px; margin-bottom: 20px; }
  .who img { width:48px; height:48px; border-radius:50%; }
  .who .name { font-weight: 700; }
  .who .mail { color: var(--sub); font-size: .9rem; }
  .msg { color: var(--sub); font-size: .9rem; margin-top: 16px; min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>とわのメモ帳</h1>
  <p class="lead">ログインの練習用（認証①）</p>

  <!-- ログインしていないときに見える箱 -->
  <section class="card" id="loggedOut">
    <p>GitHubのアカウントでログインします。パスワードはこのページには届きません。</p>
    <button class="primary" id="loginBtn">GitHubでログイン</button>
  </section>

  <!-- ログインしているときに見える箱 -->
  <section class="card" id="loggedIn" hidden>
    <div class="who">
      <img id="avatar" alt="">
      <div>
        <div class="name" id="name"></div>
        <div class="mail" id="mail"></div>
      </div>
    </div>
    <p>ログインできました。受付で「本人です」と分かってもらえた状態です。</p>
    <button class="ghost" id="logoutBtn">ログアウト</button>
  </section>

  <p class="msg" id="msg"></p>
</main>

<script type="module">
  // Supabase（受付係）を呼び出す道具を、インターネットから読み込む
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // ここに書くのは「公開してよい鍵」だけ。秘密の鍵（sb_secret_）は絶対に書かない
  const SUPABASE_URL = "https://muvosniepbrujigyfmct.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_RDpgDgRDxf9O2D6n40_P1g_aeIX5dHC";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const $ = (id) => document.getElementById(id);

  // 画面を、ログインしているかどうかで切り替える
  function show(session) {
    const user = session?.user;
    $("loggedOut").hidden = !!user;
    $("loggedIn").hidden = !user;
    if (!user) return;
    const m = user.user_metadata || {};
    $("name").textContent = m.full_name || m.user_name || "（名前なし）";
    $("mail").textContent = user.email || "";
    if (m.avatar_url) $("avatar").src = m.avatar_url; else $("avatar").hidden = true;
  }

  // 「GitHubでログイン」を押したら、GitHubの確認画面へ行き、終わったらこのページに戻ってくる
  $("loginBtn").addEventListener("click", async () => {
    $("msg").textContent = "GitHubへ移動しています…";
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "github",
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) $("msg").textContent = "ログインを始められませんでした：" + error.message;
  });

  $("logoutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    $("msg").textContent = "ログアウトしました。";
  });

  // ページを開いたとき・ログインやログアウトが起きたときに、画面を切り替える
  supabase.auth.onAuthStateChange((_event, session) => show(session));
  const { data } = await supabase.auth.getSession();
  show(data.session);
</script>
</body>
</html>
